<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Attendance System
                </h1>
                <div class="user-count">
                    <span id="userCount">0</span> Users Registered
                </div>
            </div>
        </header>

        <div class="main-grid">
            <div class="video-section">
                <div class="video-container">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Video Feed">
                    <div class="video-overlay" id="statusOverlay">
                        <div class="status-badge" id="statusBadge">Ready</div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="card">
                    <div class="card-header">
                        <h2>Register New User</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="userName">Full Name</label>
                            <input type="text" id="userName" placeholder="Enter name">
                        </div>
                        <button class="btn btn-primary" onclick="registerUser()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <line x1="19" y1="8" x2="19" y2="14"></line>
                                <line x1="22" y1="11" x2="16" y2="11"></line>
                            </svg>
                            Register User
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Mark Attendance</h2>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success" onclick="recognizeUser()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            Scan Face
                        </button>
                        <div class="result-display" id="resultDisplay"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Anti-Spoof Debug</h2>
                        <button class="btn-icon" id="debugToggleBtn" onclick="toggleDebugPoll()" title="Pause/resume">
                            <svg id="debugToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="debugPanel"><p class="text-muted">Scan a face to see anti-spoof result</p></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Registered Users</h2>
                        <button class="btn-icon" onclick="loadUsers()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="users-list" id="usersList">
                            <p class="text-muted">No users registered yet</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="activity-section">
                <div class="card">
                    <div class="card-header">
                        <h2>Recent Activity</h2>
                        <button class="btn-icon" onclick="loadLogs()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="activity-log" id="activityLog">
                            <p class="text-muted">No activity yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-content">
            <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
